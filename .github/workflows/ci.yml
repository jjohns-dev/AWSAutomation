name: ci
run-name: ci

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/ci.yml@v2
    with:
      os-matrix: '["ubuntu-latest"]'
      min-tests: 474 # 484 collected - min(floor(484 * 0.05), 10) = 484 - 10
    permissions:
      contents: read
      checks: write
