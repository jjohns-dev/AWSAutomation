name: release
run-name: release

on:
  push:
    tags:
      - "v[0-9].[0-9]+.[0-9]+" # v1.0.0
    branches: [main]
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - .gitignore
      - .github/**
  pull_request:
    branches: ["*"]

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/release.yml@v2
    with:
      artifact-name: ${{ github.event_name == 'pull_request' && 'AWSAutomation-dry-run' || 'Artifacts' }}
      dry-run: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write
