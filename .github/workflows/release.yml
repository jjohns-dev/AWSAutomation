name: release
run-name: release

on:
  push:
    tags:
      - "v[0-9].[0-9]+.[0-9]+" # v1.0.0
    branches: [main]
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - .gitignore
      - .github/**

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: jjohns-dev/pwsh-module-ci/.github/workflows/release.yml@v1.3.1
    permissions:
      contents: write
